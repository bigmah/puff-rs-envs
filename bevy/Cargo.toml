[package]
name = "bevy-envs"
version = "0.1.0"
edition = "2021"
description = "Envs for puff-rs whose physics is Bevy and Avian, on puff-rs-bevy"
publish = false

[lib]
name = "bevy_envs"
path = "src/lib.rs"

[[bin]]
name = "bevy-envs"
path = "src/main.rs"

[[bin]]
name = "bevy-bench"
path = "src/bench.rs"

[dependencies]
puff-rs = { git = "https://github.com/bigmah/puff-rs", branch = "main" }
# BevyEnv and Arenas, and the bevy and avian2d it re-exports
puff-rs-bevy = { git = "https://github.com/bigmah/puff-rs-bevy", branch = "main" }
