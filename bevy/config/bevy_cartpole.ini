[base]
env_name = bevy_cartpole

[vec]
total_agents = 4096

[policy]
hidden_size = 64
num_layers = 1

[env]
# Arenas on screen when watching (eval with a window), and how many times real time
num_agents = 9
view_speed = 1
# Arenas in each Bevy world; total_agents / arenas worlds, stepped on the vecenv's threads
arenas = 512
max_steps = 500

[train]
total_timesteps = 20_000_000
gamma = 0.99
learning_rate = 0.005
minibatch_size = 32768
ent_coef = 0.01
